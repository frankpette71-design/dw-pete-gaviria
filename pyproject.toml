[project]
name = "dw_pete_gaviria"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster",
    "dagster-cloud>=1.13.26",
    "dagster-gcp",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dw_pete_gaviria"
registry_modules = [
    "dw_pete_gaviria.components.*",
]